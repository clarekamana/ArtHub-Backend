version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arthub
      POSTGRES_PASSWORD: arthub
      POSTGRES_DB: arthub
    ports:
      - "5432:5432"
    volumes:
      - arthub_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible object storage for local dev, standing in for Cloudflare R2/Backblaze B2 (Section 4.1)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - arthub_minio_data:/data

volumes:
  arthub_pg_data:
  arthub_minio_data:
